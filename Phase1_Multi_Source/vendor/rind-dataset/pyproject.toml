[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rind-dataset"
version = "2.0.0"
description = "Vendored RIND schema-v3 reader and continuous-geometry renderer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.58"]

[tool.setuptools.packages.find]
include = ["rind_dataset*"]
