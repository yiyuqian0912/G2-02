[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rind-phase1-multi"
version = "0.1.0"
description = "Multi-source additive RIND observations and joint-source physical evaluation"
requires-python = ">=3.10"
dependencies = ["rind-dataset==2.0.0"]

[project.optional-dependencies]
train = ["torch>=2.0"]
browser = ["flask>=3.0", "pillow>=10.0"]
diagnostics = ["matplotlib>=3.7"]

[project.scripts]
rind-multi-install-data = "rind_phase1_multi.install_data:main"
rind-multi-browser = "rind_phase1_multi.browser:main"
rind-multi-teacher = "rind_phase1_multi.teacher:main"

[tool.uv.sources]
rind-dataset = { path = "vendor/rind-dataset", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
