[project]
name = "rind3d-posterior"
version = "0.2.0"
description = "Certified single-source global posterior labels for RIND3D (tau-pencil engine, CPU reference and exact GPU pass)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.60", "scipy>=1.12"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
