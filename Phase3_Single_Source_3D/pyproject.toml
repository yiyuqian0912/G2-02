[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rind-phase3"
version = "0.1.0"
description = "Local observations and certified physical-teacher queries for RIND3D"
requires-python = ">=3.12,<3.14"
dependencies = ["rind3d-reader>=0.1,<0.2", "numpy>=2.2,<3"]

[project.optional-dependencies]
physics = ["rind3d==0.3.0"]
train = ["torch>=2.4"]
dev = ["pytest>=9", "pybind11>=3", "psutil>=6"]
viewer = ["scipy>=1.13"]

[project.scripts]
rind3d-download = "rind_phase3.download:main"

[tool.uv.sources]
rind3d-reader = {path = "../RIND3D_Generator/reader"}
rind3d = {path = "../RIND3D_Generator", editable = true}
rind-dataset = {path = "../RIND3D_Generator/vendor/canonical_geometry", editable = true}
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rind_phase3 = ["release.json", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
